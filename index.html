<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGVRP Custom Speedo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Kecepatan -->
        <div class="speed-box">
            <span id="speed" class="val">0</span>
            <span class="unit">KM/H</span>
        </div>

        <!-- Detail Informasi -->
        <div class="details">
            <div class="info-group">
                <span class="label">GEAR</span>
                <span id="gear" class="val">N</span>
            </div>
            <div class="info-group">
                <span class="label">FUEL</span>
                <span id="fuel" class="val">100%</span>
            </div>
            <div class="info-group">
                <span class="label">ENGINE</span>
                <span id="health" class="val">100%</span>
            </div>
        </div>

        <!-- Indikator Seatbelt & Lock -->
        <div class="indicators">
            <div id="seatbelt" class="icon off">SEATBELT</div>
            <div id="door-lock" class="icon off">UNLOCKED</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
