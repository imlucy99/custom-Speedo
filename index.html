<div class="hud-container">
    <div class="speed-box">
        <span id="speed">0</span>
        <span class="unit">KM/H</span>
    </div>

    <hr>

    <div class="details">
        <div>
            <span class="label">GEAR</span>
            <span id="gear" class="val">N</span>
        </div>
        <div>
            <span class="label">FUEL</span>
            <span id="fuel" class="val">100%</span>
        </div>
    </div>

    <!-- Tambahan Indikator Baru -->
    <div class="indicators">
        <span id="seatbelt" class="icon off">SEATBELT</span>
        <span id="door-lock" class="icon off">LOCK</span>
        <div class="signals">
            <span id="signal-left" class="icon off">◄</span>
            <span id="signal-right" class="icon off">►</span>
        </div>
    </div>
</div>
