<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGVRP Custom Speedo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Top Signals & Headlights -->
        <div class="top-row">
            <span id="signal-left" class="icon off">◄</span>
            <span id="headlights" class="status-badge off">LIGHTS OFF</span>
            <span id="signal-right" class="icon off">►</span>
        </div>

        <!-- Speedometer Section -->
        <div class="speed-box">
            <span id="speed" class="val">0</span>
            <span class="unit">MPH</span>
        </div>

        <!-- RPM Bar Horizontal -->
        <div class="rpm-container">
            <div class="rpm-header">
                <span class="label">RPM</span>
            </div>
            <div class="rpm-bar-bg">
                <div id="rpm-bar" class="rpm-bar-fill"></div>
            </div>
        </div>

        <!-- Odometer & Engine State -->
        <div class="sub-info">
            <span id="engine-state" class="badge off">ENG OFF</span>
            <span id="odometer">0.0 Miles</span>
        </div>

        <!-- Telemetry Details -->
        <div class="details">
            <div class="info-group">
                <span class="label">GEAR</span>
                <span id="gear" class="val">N</span>
            </div>
            <div class="info-group">
                <span class="label">FUEL</span>
                <span id="fuel" class="val">100%</span>
            </div>
            <div class="info-group">
                <span class="label">HEALTH</span>
                <span id="health" class="val">100%</span>
            </div>
        </div>

        <!-- Seatbelt Status -->
        <div class="bottom-row">
            <div id="seatbelt" class="icon off">SEATBELT</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
